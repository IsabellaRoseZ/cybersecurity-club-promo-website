<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Club Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #140500;
      --panel: rgba(45, 10, 4, 0.88);
      --panel-strong: #3a0c05;
      --text: #fff8df;
      --muted: #ffd993;
      --red: #ff2f1f;
      --yellow: #ffd21f;
      --gold: #ff9f1c;
      --orange: #ff6b1a;
      --line: rgba(255, 210, 31, 0.28);
      --shadow: 0 24px 80px rgba(74, 9, 0, 0.55);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 210, 31, 0.22), transparent 32rem),
        radial-gradient(circle at 80% 10%, rgba(255, 47, 31, 0.24), transparent 30rem),
        linear-gradient(135deg, #170500 0%, #3a0c05 48%, #100200 100%);
      min-height: 100vh;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.08) 3px);
      z-index: 0;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--line);
      background: rgba(24, 4, 0, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    main, footer { position: relative; z-index: 1; }
    section { scroll-margin-top: 5.5rem; }

    .nav {
      max-width: 1320px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
      letter-spacing: -0.04em;
      font-size: 1.25rem;
    }

    .logo-mark {
      color: var(--yellow);
      font-family: "JetBrains Mono", monospace;
      margin-right: 0.2rem;
    }

    .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 800;
    }
    .nav-links a:hover { color: var(--yellow); }

    .hero {
      max-width: 1320px;
      margin: 0 auto;
      padding: 6rem 1.25rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 520px);
      gap: 3.5rem;
      align-items: center;
    }

    .hero-copy { min-width: 0; }
    .eyebrow {
      color: var(--yellow);
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(3rem, 6vw, 5.6rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      margin-bottom: 1.3rem;
      max-width: 760px;
    }
    h2 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: -0.06em;
      margin-bottom: 0.8rem;
    }
    h3 { font-size: 1.55rem; margin-bottom: 0.75rem; }
    .hero-text, .section-heading p, .join-section p, .challenge-card p {
      color: var(--muted);
      line-height: 1.65;
    }
    .hero-text { font-size: 1.12rem; max-width: 720px; }

    .hero-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.6rem; }
    .button, .flag-form button, .hint-button {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.85rem 1.1rem;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .button:hover, .flag-form button:hover, .hint-button:hover { transform: translateY(-2px); }
    .primary, .flag-form button {
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      color: #260600;
      box-shadow: 0 12px 30px rgba(255, 210, 31, 0.28);
    }
    .secondary, .hint-button {
      color: var(--text);
      background: rgba(255, 210, 31, 0.08);
      border: 1px solid var(--line);
    }

    .terminal-card, .challenge-card, .stats article, .join-section {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
